<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <style>
            .bolt { fill: #1E3A8A; }
            .thread { fill: none; stroke: #F59E0B; stroke-width: 1.5; }
            @media (prefers-color-scheme: dark) {
                .bolt { fill: #3B82F6; }
            }
        </style>
    </defs>
    
    <!-- Cabeza hexagonal del perno -->
    <polygon class="bolt" points="50,15 65,22.5 65,37.5 50,45 35,37.5 35,22.5"/>
    
    <!-- Vástago del perno -->
    <rect class="bolt" x="42" y="45" width="16" height="45" rx="1"/>
    
    <!-- Rosca del perno (líneas diagonales) -->
    <line class="thread" x1="42" y1="50" x2="58" y2="50"/>
    <line class="thread" x1="42" y1="56" x2="58" y2="56"/>
    <line class="thread" x1="42" y1="62" x2="58" y2="62"/>
    <line class="thread" x1="42" y1="68" x2="58" y2="68"/>
    <line class="thread" x1="42" y1="74" x2="58" y2="74"/>
    <line class="thread" x1="42" y1="80" x2="58" y2="80"/>
    <line class="thread" x1="42" y1="86" x2="58" y2="86"/>
</svg>
